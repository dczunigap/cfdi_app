<div class="mx-auto mt-10 max-w-3xl space-y-6">
  <div class="rounded-3xl border border-border bg-surface/90 p-10 shadow-card">
    <div class="flex items-start justify-between gap-6">
      <div>
        <div class="text-xs uppercase tracking-[0.28em] text-muted">Inicio</div>
        <h1 class="mt-3 font-display text-3xl text-text">Bienvenido</h1>
        <p class="mt-3 max-w-xl text-sm text-muted">
          Selecciona el RFC con el que vas a trabajar para habilitar los modulos de la plataforma.
        </p>
      </div>
      <div class="hidden h-16 w-16 rounded-2xl border border-border bg-bg/70 p-3 text-text/60 md:flex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 12h18M7 6h10M7 18h10" />
        </svg>
      </div>
    </div>

    <div class="mt-8 grid gap-6 md:grid-cols-[1.2fr_0.8fr]">
      <div class="rounded-2xl border border-border bg-bg p-5">
        <app-rfc-selector [collapsed]="false" label="RFC activo" [showBadge]="false"></app-rfc-selector>
        @if (notice()) {
          <div class="mt-4 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
            {{ notice() }}
          </div>
        }
      </div>
      <div class="rounded-2xl border border-border bg-bg p-5">
        <div class="text-xs uppercase tracking-[0.2em] text-muted">Siguiente paso</div>
        <p class="mt-3 text-sm text-muted">
          Con el RFC seleccionado puedes ver resumenes, importar CFDI y generar reportes.
        </p>
        <button
          class="btn btn-s mt-6 w-full rounded-xl bg-primary text-white shadow-sm shadow-primary/20 hover:shadow-md disabled:opacity-60"
          type="button"
          [disabled]="!canContinue()"
          (click)="continue()"
        >
          Continuar
        </button>
      </div>
    </div>
  </div>
</div>
