<div class="alert-card" [ngClass]="classes">
  <div class="alert-content">
    <div class="alert-text">
      @if (title) {
        <div class="alert-title">{{ title }}</div>
      }
      <div class="alert-message">{{ message }}</div>
    </div>
    @if (dismissible) {
      <button
        type="button"
        class="alert-close"
        (click)="closed.emit()"
        aria-label="Cerrar"
        >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M18 6L6 18M6 6l12 12"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            />
        </svg>
      </button>
    }
  </div>
</div>
